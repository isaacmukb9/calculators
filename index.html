<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="style.css">
	<title>Calculator Interface</title>
</head>

<body>
	<section class="calculator">
		<div class="flex">
			<!--   the Display screen  -->
			<div class="screen">
				<div class="disp">
					<p class="inp">0</p>
				</div>
			</div>
			
			<!-- The main components  -->
			<div class="contnt">
				<!-- the lower buttons section  -->
				<section class="lower">
					<div class="colmn">
						<div class="grid-col">
							<button class="num ac">AC</button>
							<button class="num">7</button>
							<button class="num">4</button>
							<button class="num">1</button>
							<button class="zero">0</button>
						</div>

						<div class="grid-col">
							<button class="num">00</button>
							<button class="num">8</button>
							<button class="num">5</button>
							<button class="num">2</button>
							
						</div>

						<div class="grid-col">
							<button class="num">%</button>
							<button class="num">9</button>
							<button class="num">6</button>
							<button class="num">3</button>
							<button class="num">.</button>
						</div>

						<div class="grid-col">
							<button class="comp">&divide</button>
							<button class="comp">x</button>
							<button class="comp">-</button>
							<button class="comp">+</button>
							<button class="comp">=</button>
						</div>
					</div>
				</section>
			</div>
		</div>
	</section>
	<footer>
		<p>&copy;Mukiibi Isaac</p>
	</footer>
</body>
</html>
